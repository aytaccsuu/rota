# Rota Planı — Cloudflare Workers sürümü (Render/Python sürümüyle aynı arayüz ve uç noktalar)
name = "rota-plani"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Panelden girilen düz ayarlar yayına almada silinmesin
keep_vars = true

# index.html ve giris.html (npm run build ile ana klasörden kopyalanır). Giriş kontrolü için önce Worker çalışır.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Veritabanı (planlar, hakediş, yakıt, kullanıcılar, konum hafızası, ayarlar)
[[d1_databases]]
binding = "DB"
database_name = "rota-plani"
database_id = "4405cfcf-fce0-4924-ae29-e715a2750d51"
migrations_dir = "migrations"

# Evrak görselleri: R2 (isteğe bağlı). Bu bölüm yoksa görseller D1'de saklanır.
# [[r2_buckets]]
# binding = "EVRAK"
# bucket_name = "rota-evrak"

# Workers AI: Gemini kotası bittiğinde evrak okuma ve adres düzeltme yedeği
[ai]
binding = "AI"

[vars]
# Gizli olmayan ayarlar. Anahtar ve şifreler "wrangler secret put" ile girilir:
#   ROTA_KULLANICILAR, ROTA_GIZLI, YANDEX_MAPS_JS_KEY, YANDEX_GEOCODER_API_KEY, TOMTOM_API_KEY,
#   MAPTILER_API_KEY, GEOAPIFY_API_KEY, GEMINI_API_KEY, ORS_API_KEY, GOOGLE_MAPS_API_KEY
ROTA_YONETICI = "aytac"
# Neon'dan taşıma bitince bu satırı silip yeniden yayına alın
TASIMA_ACIK = "1"
# DEPO_KOORDINAT ve EV_KOORDINAT panelden girilir (ör. "41.012345, 29.123456")
