# Render.com ücretsiz yayın ayarı. Gizli değerler (sync: false) Render panelinden girilir, koda yazılmaz.
services:
  - type: web
    name: rota-olusturucu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python sunucu.py
    envVars:
      - key: ROTA_HOST
        value: 0.0.0.0
      - key: ROTA_NOBROWSER
        value: "1"
      # Kullanıcılar: "mesut:sifre1, ali:sifre2" (giriş ekranı). Boşsa ROTA_SIFRE ile tek şifre kullanılır.
      - key: ROTA_KULLANICILAR
        sync: false
      - key: ROTA_SIFRE
        sync: false
      # Yönetici (kullanıcı ekler/siler, anahtar ve fiyat ayarı). Boşsa "aytac" hesabı yöneticidir.
      - key: ROTA_YONETICI
        sync: false
      - key: DEPO_KOORDINAT
        sync: false
      - key: EV_KOORDINAT
        sync: false
      - key: YANDEX_MAPS_JS_KEY
        sync: false
      - key: YANDEX_GEOCODER_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      # Yol hesabı yedeği (ücretsiz anahtar: openrouteservice.org) — canlı trafik ve TomTom alınamazsa
      - key: ORS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Kalıcı veritabanı: Neon (ücretsiz PostgreSQL) bağlantı adresi
      - key: DATABASE_URL
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
