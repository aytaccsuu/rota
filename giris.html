<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · Rota Planı</title>
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#19322e;--mute:#70817c;--line:#e1e8e5;--pri:#147d64;--bad:#bc4545}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 8px 30px #19322e0d}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-icon{width:44px;height:44px;display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:12px;flex:none}
.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}
.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--mute);font-weight:700}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:13px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;color:var(--ink)}
input:focus{outline:3px solid #79cdb1;outline-offset:1px;border-color:var(--pri)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:8px;cursor:pointer}
button.p{width:100%;margin-top:22px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--pri);border:0;border-radius:10px;cursor:pointer}
button.p:active{background:#106950}
.err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:#fbeeee;color:var(--bad);font-size:14px}
.err.show{display:block}
.note{margin-top:18px;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<main class="box">
  <div class="brand">
    <div class="brand-icon"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="2.5" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="18" r="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 6H16a4 4 0 0 1 0 8H8a4 4 0 0 0 0 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
    <div><h1>Rota Planı</h1><small>GÜNLÜK DAĞITIM ASİSTANI</small></div>
  </div>
  <form method="post" action="/giris" autocomplete="on">
    <label for="kullanici">Kullanıcı adı</label>
    <input id="kullanici" name="kullanici" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="sifre">Şifre</label>
    <div class="pw"><input id="sifre" name="sifre" type="password" autocomplete="current-password" required><button type="button" id="goster" aria-label="Şifreyi göster">Göster</button></div>
    <div class="err" id="err" role="alert"></div>
    <button class="p" type="submit">Giriş yap</button>
  </form>
  <p class="note">Oturum bu cihazda 30 gün açık kalır.</p>
</main>
<script>
const q=new URLSearchParams(location.search),e=document.getElementById('err');
const msg={'1':'Kullanıcı adı veya şifre hatalı.','kilit':'Çok fazla hatalı deneme. Birkaç dakika sonra tekrar deneyin.','cikis':'Çıkış yapıldı.'}[q.get('hata')||q.get('durum')];
if(msg){e.textContent=msg;e.classList.add('show');if(q.get('durum')==='cikis'){e.style.background='#e5f1eb';e.style.color='var(--pri)'}}
const s=document.getElementById('sifre'),g=document.getElementById('goster');
g.onclick=()=>{const v=s.type==='password';s.type=v?'text':'password';g.textContent=v?'Gizle':'Göster'};
</script>
</body>
</html>
